<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simon Says</title>
  </head>
  <body>
    <main>
      <h1>Simon Says</h1>
      <div id="status">Press Start</div>
      <div class="board locked" id="board">
        <button class="pad" data-pad="green" aria-label="Green"></button>
        <button class="pad" data-pad="red" aria-label="Red"></button>
        <button class="pad" data-pad="yellow" aria-label="Yellow"></button>
        <button class="pad" data-pad="blue" aria-label="Blue"></button>
      </div>
      <button id="start">Start</button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
